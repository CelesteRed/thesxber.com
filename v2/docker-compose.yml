services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sxber}
      POSTGRES_USER: ${POSTGRES_USER:-sxber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
    volumes:
      - sxber-postgres:/var/lib/postgresql/data
    # Deliberately no `ports` entry: PostgreSQL is reachable only by the app
    # over the private Docker network below.
    expose:
      - "5432"
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sxber} -d ${POSTGRES_DB:-sxber}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: ${DATABASE_URL:-postgresql://sxber:change-this-postgres-password@db:5432/sxber}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_STARTUP_RETRIES: ${DATABASE_STARTUP_RETRIES:-30}
      DATABASE_STARTUP_DELAY_MS: ${DATABASE_STARTUP_DELAY_MS:-1500}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      YOUTUBE_CHANNEL_ID: ${YOUTUBE_CHANNEL_ID}
      YOUTUBE_CACHE_TTL_SECONDS: ${YOUTUBE_CACHE_TTL_SECONDS:-60}
      WEBP_QUALITY: ${WEBP_QUALITY:-82}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-900}
      AUTH_RATE_LIMIT_MAX_REQUESTS: ${AUTH_RATE_LIMIT_MAX_REQUESTS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8787}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-43200}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI:-}
      DISCORD_ALLOWED_USER_IDS: ${DISCORD_ALLOWED_USER_IDS}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://127.0.0.1:8787}
      FANART_WEBP_DIR: ${FANART_WEBP_DIR:-./data/fanart-webp}
    networks:
      - public
      - database
    ports:
      - "${APP_PORT:-8787}:8787"

volumes:
  sxber-postgres:

networks:
  public:
    driver: bridge
  database:
    driver: bridge
    internal: true
